[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="bifang-terminal"
version="0.2.1.dev11"
description="Bifang: Build. Run. Verify. — An evidence-driven coding agent powered by NVIDIA models on Nebius"
readme="README.md"
requires-python=">=3.11,<3.12"
license={text="Apache-2.0"}
dependencies=["httpx>=0.27,<1","pydantic>=2.8,<3","rich>=13.8,<15","textual>=0.85,<2","python-dotenv>=1.0,<2","fastapi>=0.110,<1","uvicorn>=0.29,<1","pillow>=13,<14","psutil>=7.2,<8","packaging>=24,<27","langchain>=1.4,<2","langchain-experimental>=0.4,<1","langsmith>=0.14,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9","ruff>=0.7,<1","pyinstaller>=6,<7"]
observability=["opentelemetry-api>=1.25,<2","opentelemetry-sdk>=1.25,<2","opentelemetry-exporter-otlp-proto-http>=1.25,<2"]
[project.scripts]
bifang="bifang.cli:main"
bifang-server="bifang.server:main"
[tool.hatch.build.targets.wheel]
packages=["src/bifang"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
[tool.ruff]
line-length=100
[tool.ruff.lint.per-file-ignores]
"src/bifang/remote_executor.py"=["UP041"]
"src/bifang/plugins/manager.py"=["S102", "BLE001"]
