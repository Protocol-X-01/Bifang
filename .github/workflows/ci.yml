name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: uv sync --locked --extra dev --extra observability
      - run: uv run python -m compileall -q src
      - name: Lint maintained safety-critical modules
        run: >-
          uv run ruff check src/bifang/workspace.py src/bifang/tracing
          tests/test_workspace.py tests/test_config_env.py tests/test_ngc.py
          tests/test_phoenix_tracing.py tests/test_server_auth.py
      - run: uv run pytest -q

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

  desktop-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri:build -- --bundles deb --ci
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: bifang-linux-deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bifang-coding-agent:${{ github.sha }} .

