name: iOS companion build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'companion/**'
      - 'desktop/src/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/tsconfig.json'
      - '.github/workflows/ios-companion.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'desktop/src/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/tsconfig.json'
      - '.github/workflows/ios-companion.yml'

permissions:
  contents: read

jobs:
  build:
    name: Bifang Companion (iOS, unsigned archive)
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            companion/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri

      - name: Install shared desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci --skip-targets-install

      - name: Build unsigned iOS archive
        run: npm run tauri ios build -- --ci --target aarch64 --no-sign --archive-only

      - name: Collect archive and checksum
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCHIVE=$(find src-tauri/gen/apple -type d -name '*.xcarchive' -print -quit)
          test -n "$ARCHIVE" || { echo 'Tauri completed without producing an iOS archive'; exit 1; }
          mkdir -p build
          OUTPUT="build/Bifang-Companion_v${VERSION}_arm64_unsigned.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "$OUTPUT"
          shasum -a 256 "$OUTPUT" > "${OUTPUT}.sha256"
          ls -lh "$OUTPUT" "${OUTPUT}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bifang-companion-ios
          path: |
            companion/build/*.xcarchive.zip
            companion/build/*.xcarchive.zip.sha256
          if-no-files-found: error
