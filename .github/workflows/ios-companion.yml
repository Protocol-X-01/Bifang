name: iOS companion build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'companion/**'
      - 'desktop/src/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/tsconfig.json'
      - '.github/workflows/ios-companion.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'desktop/src/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/tsconfig.json'
      - '.github/workflows/ios-companion.yml'

permissions:
  contents: read

jobs:
  build:
    name: Bifang Companion (iOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            companion/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri

      - name: Install shared desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci --skip-targets-install

      - name: Build with Tauri CLI
        id: tauri_build
        continue-on-error: true
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
        run: npm run tauri ios build -- --ci --target aarch64 --export-method debugging

      - name: Fallback unsigned Xcode archive
        if: steps.tauri_build.outcome == 'failure'
        run: |
          mkdir -p build
          PROJ=$(find src-tauri/gen/apple -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)
          test -n "$PROJ" || { echo 'Tauri did not generate an Xcode project'; exit 1; }
          xcodebuild -list -json -project "$PROJ" > build/xcode-project.json
          SCHEME=$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])).get("project", {}); s=p.get("schemes", []); print(next((x for x in s if x.endswith("_iOS")), s[0] if s else ""))' build/xcode-project.json)
          test -n "$SCHEME" || { echo 'No buildable Xcode scheme was generated'; cat build/xcode-project.json; exit 1; }
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/archive.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Collect IPA and archive
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APP=$(find src-tauri/gen/apple -path '*/Applications/*.app' -type d | head -1)
          [ -n "$APP" ] || APP=$(find build/archive.xcarchive/Products/Applications -name '*.app' -type d | head -1)
          test -n "$APP"
          echo "App bundle: $APP"
          rm -rf Payload "Bifang-Companion_v${VERSION}_arm64_unsigned.ipa"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "Bifang-Companion_v${VERSION}_arm64_unsigned.ipa" Payload
          rm -rf Payload
          if [ -d build/archive.xcarchive ]; then
            zip -qry "Bifang-Companion_v${VERSION}_arm64.xcarchive.zip" build/archive.xcarchive
          fi
          shasum -a 256 "Bifang-Companion_v${VERSION}_arm64_unsigned.ipa" > "Bifang-Companion_v${VERSION}_arm64_unsigned.ipa.sha256"
          ls -l *.ipa *.sha256 *.xcarchive.zip 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bifang-companion-ios
          path: |
            companion/*.ipa
            companion/*.ipa.sha256
            companion/*.xcarchive.zip
          if-no-files-found: error
