services:
  - type: web
    name: bifang-judge-relay
    runtime: docker
    dockerfilePath: ./deploy/judge-relay/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: BIFANG_JUDGE_TOKEN
        generateValue: true
      - key: BIFANG_JUDGE_TOKEN_EXPIRES_AT
        value: "2026-12-23T20:00:00Z"
