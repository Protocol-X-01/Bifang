<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Bifang — Build. Run. Verify.</title>
  <desc id="desc">An open-source Nemotron coding workspace for desktop, terminal and mobile, with disposable worktrees, approvals and reviewable diffs. Geometric Bifang bird in red, orange and white on deep slate.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#192237"/></linearGradient>
    <radialGradient id="heat"><stop stop-color="#E63946" stop-opacity=".2"/><stop offset="1" stop-color="#E63946" stop-opacity="0"/></radialGradient>
    <linearGradient id="fire"><stop stop-color="#E63946"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#64748B" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="430" rx="20" fill="url(#background)"/>
  <rect width="1280" height="430" rx="20" fill="url(#grid)"/>
  <ellipse cx="1040" cy="200" rx="320" ry="260" fill="url(#heat)"/>
  <path d="M58 54h36" stroke="url(#fire)" stroke-width="4" stroke-linecap="round"/>
  <text x="58" y="110" fill="#F7F7F7" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="750" letter-spacing="7">BIFANG</text>
  <text x="58" y="192" fill="#F7F7F7" font-family="Inter,Segoe UI,sans-serif" font-size="60" font-weight="750" letter-spacing="-2">Build. Run. Verify.</text>
  <text x="60" y="235" fill="#B8C3D6" font-family="Inter,Segoe UI,sans-serif" font-size="20">A coding workspace with a reviewable agent loop.</text>
  <text x="60" y="271" fill="#FFAE77" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="650" letter-spacing="1.5">NEMOTRON · NEBIUS TOKEN FACTORY</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#CCD5E2">
    <rect x="58" y="322" width="180" height="35" rx="6" fill="#1C2940" stroke="#34435D"/><text x="148" y="344" text-anchor="middle">DESKTOP · TUI · MOBILE</text>
    <rect x="250" y="322" width="209" height="35" rx="6" fill="#1C2940" stroke="#34435D"/><text x="355" y="344" text-anchor="middle">DISPOSABLE WORKTREES</text>
    <rect x="471" y="322" width="178" height="35" rx="6" fill="#1C2940" stroke="#34435D"/><text x="560" y="344" text-anchor="middle">APPROVALS + DIFFS</text>
  </g>
  <path d="M810 73v284" stroke="#34435D" stroke-opacity=".65"/>
  <g transform="translate(882 56) scale(.62)">
    <path d="M404 130c48 62 32 163-35 231-67 68-170 93-244 49" stroke="#E63946" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M126 354c-24-52-11-121 39-176" stroke="#FF8A3D" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="m180 309 99-71 40-82 33-35 25 8-15 18 31 5-23 13-20-2-22 24-15 76 47 49-17 20-55-30-42 53-64 61-9-25 38-48-51 22-20-18Z" fill="#F7F7F7"/>
    <path d="m280 238-88-83 24 99-66-45 35 79-54-18 41 65 73-27 42-53 64 40-33-60" fill="#FF8A3D"/>
    <path d="m281 240-67-55 21 75-54-37 27 62-42-13 31 45 52-19 37-45 47 30-27-47" fill="#F7F7F7"/>
    <path d="m287 337-8 92m8-37 35 29" stroke="#F7F7F7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="1065" y="374" fill="#9AA9BF" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="3">OPEN SOURCE</text>
</svg>
